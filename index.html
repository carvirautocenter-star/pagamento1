<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento via Pix - I-TIQUETA</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      background-color: #f0f2f5; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px 14px; 
    }
    .card { 
      background: #ffffff; 
      border-radius: 24px; 
      padding: 32px 24px; 
      max-width: 380px; 
      width: 100%; 
      box-shadow: 0 12px 30px rgba(0,0,0,0.08); 
      text-align: center; 
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }
    .brand span {
      color: #0066ff;
    }
    .badge { 
      background: #e8f5e9; 
      color: #2e7d32; 
      font-weight: 700; 
      font-size: 11px; 
      padding: 4px 12px; 
      border-radius: 20px; 
      display: inline-block; 
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h2 { 
      color: #1a1a1a; 
      font-size: 19px; 
      font-weight: 700;
      margin-bottom: 6px; 
    }
    p.subtitle { 
      color: #666; 
      font-size: 13px; 
      line-height: 1.4;
      margin-bottom: 24px; 
    }
    
    .btn-pay { 
      background: #0066ff; 
      color: #ffffff; 
      font-size: 16px; 
      font-weight: 700; 
      border: none; 
      border-radius: 16px; 
      padding: 18px; 
      width: 100%; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-pay:active { 
      transform: scale(0.98);
      background: #0052cc; 
    }

    /* Card de Instruções/Feedback */
    .status-box { 
      margin-top: 18px; 
      padding: 16px;
      background: #e8f5e9;
      border-radius: 14px;
      font-size: 13px; 
      color: #2e7d32; 
      font-weight: 600; 
      display: none; 
      text-align: left;
      line-height: 1.5;
    }
    .status-box p { 
      margin-top: 4px; 
      font-weight: 400; 
      color: #1b5e20; 
      font-size: 12px; 
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand"><span>I-</span>TIQUETA</div>
    <span class="badge">● Recebedor Pix</span>
    <h2 id="nome-loja">DIMAS GALDINO DA SILVA</h2>
    <p class="subtitle">Aproxime ou toque no botão para pagar com Pix de forma instantânea.</p>

    <button class="btn-pay" onclick="processarPagamento()">
      <span>Pagar via Pix</span>
    </button>

    <div id="statusBox" class="status-box">
      <div>✓ Código Pix copiado com sucesso!</div>
      <p>Caso seu aplicativo de banco não abra automaticamente, abra o app do seu banco e selecione a opção <strong>Pix Copia e Cola</strong>.</p>
    </div>
  </div>

  <script>
    // Payload Pix Padrão
    const pixPayload = "00020126580014br.gov.bcb.pix0136d4f08689-848c-4bd7-bbbc-bd364fc59cc427600016BR.COM.PAGSEGURO01368FD85AD6-2954-40F4-8AEE-D823EF21A4895204753853039865802BR5922DIMAS GALDINO DA SILVA6015Sao Jose do Ser62290525PAGS0000000002610100651776304106A";

    async function copiarCodigo() {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pixPayload);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = pixPayload;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
    }

    async function processarPagamento() {
      // 1. Garante que o código Pix seja copiado para a área de transferência
      await copiarCodigo();

      // Exibe a mensagem de confirmação
      document.getElementById('statusBox').style.display = 'block';

      // Feedback tátil (vibração), se disponível
      if (navigator.vibrate) {
        navigator.vibrate(80);
      }

      // 2. Tenta acionar a gaveta nativa do Android (Carteira do Google / Seletor do Sistema)
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        setTimeout(() => {
          // Intent genérica do Android para solicitar abertura do seletor/carteira com o payload do Pix
          window.location.href = "intent://#Intent;action=android.intent.action.VIEW;type=text/plain;S.android.intent.extra.TEXT=" + encodeURIComponent(pixPayload) + ";end";
        }, 300);
      }
    }
  </script>

</body>
</html>
