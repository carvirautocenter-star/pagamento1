<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento via Pix</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    body { 
      background-color: #f0f2f5; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      padding: 20px 12px; 
    }
    .card { 
      background: #ffffff; 
      border-radius: 20px; 
      padding: 28px 20px; 
      max-width: 380px; 
      width: 100%; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.06); 
      text-align: center; 
    }
    .badge { 
      background: #e8f5e9; 
      color: #2e7d32; 
      font-weight: 700; 
      font-size: 11px; 
      padding: 4px 12px; 
      border-radius: 20px; 
      display: inline-block; 
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h2 { 
      color: #1a1a1a; 
      font-size: 18px; 
      font-weight: 700;
      margin-bottom: 6px; 
    }
    p.subtitle { 
      color: #666; 
      font-size: 13px; 
      line-height: 1.4;
      margin-bottom: 24px; 
    }
    
    .btn-pay { 
      background: #0066ff; 
      color: #ffffff; 
      font-size: 16px; 
      font-weight: 700; 
      border: none; 
      border-radius: 14px; 
      padding: 18px; 
      width: 100%; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 14px rgba(0, 102, 255, 0.3);
    }
    .btn-pay:active { 
      transform: scale(0.98);
      background: #0052cc; 
    }

    /* Modal / Pop-up Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 32px 20px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h3 {
      font-size: 16px;
      color: #1a1a1a;
      font-weight: 700;
    }
    .close-btn {
      background: #f0f2f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }

    .banks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .btn-bank {
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-bank:active {
      background: #e2e8f0;
      transform: scale(0.97);
    }

    .status-msg { 
      margin-top: 16px; 
      padding: 12px;
      background: #e8f5e9;
      border-radius: 10px;
      font-size: 13px; 
      color: #2e7d32; 
      font-weight: 600; 
      display: none; 
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">● Recebedor Pix</span>
    <h2 id="nome-loja">DIMAS GALDINO DA SILVA</h2>
    <p class="subtitle">Toque abaixo para selecionar o aplicativo do seu banco e concluir a transferência.</p>

    <button class="btn-pay" onclick="abrirModal()">
      Pagar via Pix
    </button>

    <div id="status" class="status-msg">
      ✓ Código Pix copiado!
    </div>
  </div>

  <!-- Pop-up Modal de Seleção de Banco -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModalFora(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Selecione seu Banco</h3>
        <button class="close-btn" onclick="fecharModal()">&times;</button>
      </div>

      <div class="banks-grid">
        <button class="btn-bank" onclick="abrirBanco('pagbank')">💚 PagBank</button>
        <button class="btn-bank" onclick="abrirBanco('mercadopago')">🟦 Mercado Pago</button>
        <button class="btn-bank" onclick="abrirBanco('nubank')">💜 Nubank</button>
        <button class="btn-bank" onclick="abrirBanco('itau')">🟧 Itaú</button>
        <button class="btn-bank" onclick="abrirBanco('bradesco')">🟥 Bradesco</button>
        <button class="btn-bank" onclick="abrirBanco('bb')">🟡 Banco do Brasil</button>
        <button class="btn-bank" onclick="abrirBanco('inter')">🟠 Inter</button>
        <button class="btn-bank" onclick="abrirBanco('caixa')">🔵 Caixa</button>
        <button class="btn-bank" onclick="abrirBanco('santander')">🔴 Santander</button>
        <button class="btn-bank" onclick="abrirBanco('c6')">⚫ C6 Bank</button>
        <button class="btn-bank" style="grid-column: span 2;" onclick="abrirBanco('outro')">📋 Copiar Código e Abrir Manualmente</button>
      </div>
    </div>
  </div>

  <script>
    const pixPayload = "00020126580014br.gov.bcb.pix0136d4f08689-848c-4bd7-bbbc-bd364fc59cc427600016BR.COM.PAGSEGURO01368FD85AD6-2954-40F4-8AEE-D823EF21A4895204753853039865802BR5922DIMAS GALDINO DA SILVA6015Sao Jose do Ser62290525PAGS0000000002610100651776304106A";

    function abrirModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function fecharModalFora(e) {
      if (e.target.id === 'modalOverlay') {
        fecharModal();
      }
    }

    async function copiarCodigo() {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pixPayload);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = pixPayload;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }
    }

    async function abrirBanco(bancoKey) {
      await copiarCodigo();
      fecharModal();

      const statusEl = document.getElementById('status');
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (bancoKey === 'outro') {
        statusEl.innerText = "✓ Código Pix copiado! Abra o app do seu banco e selecione 'Pix Copia e Cola'.";
        statusEl.style.display = 'block';
        return;
      }

      statusEl.innerText = "✓ Código copiado! Abrindo o aplicativo...";
      statusEl.style.display = 'block';

      setTimeout(() => {
        if (bancoKey === 'pagbank') {
          window.location.href = "https://pagseguro.uol.com.br/para-seu-negocio/aplicativos/minha-conta/download";
        } else if (bancoKey === 'mercadopago') {
          if (isAndroid) {
            window.location.href = "intent://wallet#Intent;scheme=mercadopago;package=com.mercadopago.wallet;end";
          } else {
            window.location.href = "mercadopago://";
          }
        } else if (bancoKey === 'nubank') {
          window.location.href = "nubank://";
        } else if (bancoKey === 'itau') {
          window.location.href = "itau://";
        } else if (bancoKey === 'bradesco') {
          window.location.href = "bradesco://";
        } else if (bancoKey === 'bb') {
          window.location.href = "bancodobrasil://";
        } else if (bancoKey === 'inter') {
          window.location.href = "bancointer://";
        } else if (bancoKey === 'caixa') {
          window.location.href = "caixa://";
        } else if (bancoKey === 'santander') {
          window.location.href = "santander://";
        } else if (bancoKey === 'c6') {
          window.location.href = "c6bank://";
        } else {
          statusEl.innerText = "✓ Código Pix copiado! Abra o app do seu banco.";
        }
      }, 300);
    }
  </script>

</body>
</html>
