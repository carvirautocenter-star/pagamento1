<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f0f2f5">
  <title>Pagamento via Pix - I-TIQUETA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 14px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 20px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .brand span {
      color: #0066ff;
    }

    .badge {
      background: #e8f5e9;
      color: #2e7d32;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h2 {
      color: #1a1a1a;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-option {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 16px;
      min-height: 58px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      width: 100%;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-option:active {
      transform: scale(0.98);
      background: #f8fafc;
    }

    .btn-icon-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .btn-copy-only {
      background: #0066ff;
      color: #fff;
      border: none;
      font-weight: 700;
      margin-top: 6px;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
    }

    .btn-copy-only:active {
      background: #0052cc;
    }

    .btn-copy-only img {
      filter: brightness(0) invert(1);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      padding-top: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      position: relative;
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px 24px 0 0;
      padding: 28px 22px 36px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-close-x {
      position: absolute;
      top: 16px;
      right: 18px;
      background: #f0f2f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 24px;
      font-weight: bold;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-close-modal {
      background: #0066ff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="brand"><span>I-</span>TIQUETA</div>

    <span class="badge">● Recebedor Pix</span>

    <h2 id="nome-loja">DIMAS GALDINO DA SILVA</h2>

    <p class="subtitle">
      Escolha o seu aplicativo para pagar ou copie o código Pix.
    </p>

    <div class="options-grid">

      <!-- BANCO ITAÚ -->
      <button
        type="button"
        class="btn-option"
        onclick="abrirOpcao('itau')"
      >
        <img
          class="btn-icon-img"
          src="https://upload.wikimedia.org/wikipedia/commons/2/2d/2023_Ita%C3%BA_Unibanco_Logo.png"
          alt="Banco Itaú"
        >
        <span>Banco Itaú</span>
      </button>

      <!-- PAGBANK -->
      <button
        type="button"
        class="btn-option"
        onclick="abrirOpcao('pagbank')"
      >
        <img
          class="btn-icon-img"
          src="https://ribnet.com.br/wp-content/uploads/2024/04/pagbank.png"
          alt="PagBank"
        >
        <span>PagBank (PagSeguro)</span>
      </button>

      <!-- BANCO DO BRASIL -->
      <button
        type="button"
        class="btn-option"
        onclick="abrirOpcao('bb')"
      >
        <img
          class="btn-icon-img"
          src="https://assets.hgbrasil.com/finance/companies/big/banco-do-brasil.png"
          alt="Banco do Brasil"
        >
        <span>Banco do Brasil</span>
      </button>

      <!-- NUBANK -->
      <button
        type="button"
        class="btn-option"
        onclick="abrirOpcao('nubank')"
      >
        <img
          class="btn-icon-img"
          src="https://upload.wikimedia.org/wikipedia/commons/f/f7/Nubank_logo_2021.svg"
          alt="Nubank"
        >
        <span>Nubank</span>
      </button>

      <!-- CARTEIRA DO GOOGLE -->
      <button
        type="button"
        class="btn-option"
        onclick="abrirOpcao('wallet')"
      >
        <img
          class="btn-icon-img"
          src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Google_Wallet_icon.svg/3840px-Google_Wallet_icon.svg.png"
          alt="Carteira do Google"
        >
        <span>Carteira do Google</span>
      </button>

      <!-- COPIAR CÓDIGO PIX -->
      <button
        type="button"
        class="btn-option btn-copy-only"
        onclick="abrirOpcao('copiar')"
      >
        <img
          class="btn-icon-img"
          src="https://cdn-icons-png.flaticon.com/512/84/84185.png"
          alt=""
        >
        <span>Apenas Copiar Código Pix</span>
      </button>

    </div>
  </main>

  <!-- MODAL DE INSTRUÇÕES -->
  <div
    class="modal-overlay"
    id="modalInstrucoes"
    onclick="fecharModalFora(event)"
    aria-hidden="true"
  >
    <div
      class="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tituloModal"
    >
      <button
        type="button"
        class="modal-close-x"
        onclick="fecharModal()"
        aria-label="Fechar"
      >&times;</button>

      <div class="modal-icon">✓</div>

      <div class="modal-title" id="tituloModal">
        Código Pix Copiado!
      </div>

      <div class="modal-text">
        O código Pix já está na memória do seu celular.
        <br><br>
        Abra o aplicativo do banco e escolha a opção
        <strong>Pix Copia e Cola</strong> para pagar.
      </div>

      <button
        type="button"
        class="btn-close-modal"
        onclick="fecharModal()"
      >
        Entendido
      </button>
    </div>
  </div>

  <script>
    // CÓDIGO PIX ORIGINAL
    const pixPayload =
      "00020126580014br.gov.bcb.pix0136d4f08689-848c-4bd7-bbbc-bd364fc59cc427600016BR.COM.PAGSEGURO01368FD85AD6-2954-40F4-8AEE-D823EF21A4895204753853039865802BR5922DIMAS GALDINO DA SILVA6015Sao Jose do Ser62290525PAGS0000000002610100651776304106A";


    // COPIAR CÓDIGO PIX
    async function copiarCodigo() {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pixPayload);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = pixPayload;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const copiado = document.execCommand("copy");
      document.body.removeChild(textarea);

      if (!copiado) {
        throw new Error("Não foi possível copiar o código Pix.");
      }
    }


    // MODAL
    function abrirModal() {
      const modal = document.getElementById("modalInstrucoes");
      modal.classList.add("active");
      modal.setAttribute("aria-hidden", "false");
    }

    function fecharModal() {
      const modal = document.getElementById("modalInstrucoes");
      modal.classList.remove("active");
      modal.setAttribute("aria-hidden", "true");
    }

    function fecharModalFora(event) {
      if (event.target.id === "modalInstrucoes") {
        fecharModal();
      }
    }


    // ABRIR A OPÇÃO ESCOLHIDA
    async function abrirOpcao(tipo) {

      // Preserva a cópia do Pix antes de tentar abrir o aplicativo.
      try {
        await copiarCodigo();
      } catch (erro) {
        console.error("Erro ao copiar código Pix:", erro);
      }

      if (navigator.vibrate) {
        navigator.vibrate(80);
      }

      if (tipo === "copiar") {
        abrirModal();
        return;
      }

      const isAndroid = /Android/i.test(navigator.userAgent);

      if (!isAndroid) {
        abrirModal();
        return;
      }


      // ITAÚ
      if (tipo === "itau") {
        const intentItau =
          "intent://#Intent;" +
          "action=android.intent.action.VIEW;" +
          "type=text/plain;" +
          "S.android.intent.extra.TEXT=" + encodeURIComponent(pixPayload) + ";" +
          "package=com.itau;" +
          "end";

        window.location.href = intentItau;
        setTimeout(() => { if (!document.hidden) abrirModal(); }, 1500);
        return;
      }


      // PAGBANK / PAGSEGURO
      if (tipo === "pagbank") {
        const intentPagBank =
          "intent://#Intent;" +
          "action=android.intent.action.VIEW;" +
          "type=text/plain;" +
          "S.android.intent.extra.TEXT=" + encodeURIComponent(pixPayload) + ";" +
          "package=br.com.uol.ps.myaccount;" +
          "S.browser_fallback_url=https://pagseguro.uol.com.br/para-seu-negocio/aplicativos/minha-conta/download;" +
          "end";

        window.location.href = intentPagBank;
        setTimeout(() => { if (!document.hidden) abrirModal(); }, 1500);
        return;
      }


      // BANCO DO BRASIL (CORRIGIDO)
      if (tipo === "bb") {
        const intentBB =
          "intent://pix.bcb.gov.br/qr/v2/" + encodeURIComponent(pixPayload) + "#Intent;" +
          "action=android.intent.action.VIEW;" +
          "scheme=https;" +
          "package=br.com.bb.android;" +
          "S.browser_fallback_url=https://play.google.com/store/apps/details?id=br.com.bb.android;" +
          "end";

        window.location.href = intentBB;

        setTimeout(() => {
          if (!document.hidden) {
            abrirModal();
          }
        }, 1500);

        return;
      }


      // NUBANK
      if (tipo === "nubank") {
        const intentNubank =
          "intent://#Intent;" +
          "action=android.intent.action.VIEW;" +
          "package=com.nu.production;" +
          "S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.nu.production;" +
          "end";

        window.location.href = intentNubank;
        setTimeout(() => { if (!document.hidden) abrirModal(); }, 1500);
        return;
      }


      // CARTEIRA DO GOOGLE (CORRIGIDO)
      if (tipo === "wallet") {
        const intentWallet =
          "intent://#Intent;" +
          "action=android.intent.action.VIEW;" +
          "package=com.google.android.apps.walletnfcrel;" +
          "S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.google.android.apps.walletnfcrel;" +
          "end";

        window.location.href = intentWallet;
        setTimeout(() => { if (!document.hidden) abrirModal(); }, 1500);
        return;
      }
    }


    // FECHAR MODAL COM ESC
    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        fecharModal();
      }
    });
  </script>

</body>
</html>
